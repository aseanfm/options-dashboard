name: 更新ETF期权T型报价

on:
  schedule:
    # 北京时间 10:00 = UTC 02:00
    - cron: '0 2 * * 1-5'
    # 北京时间 13:30 = UTC 05:30
    - cron: '30 5 * * 1-5'
  workflow_dispatch:   # 允许手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python3 fetch_build.py
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "行情更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git push
